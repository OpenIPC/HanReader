name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The application-build matrix arrives with the app targets later in M1, and
# the dictionary job in M3. All jobs run in parallel for complete feedback on
# each push: `spm-test` is the fast lane where most of the suite will live, and
# `architecture` is what actually enforces the module boundaries -- see its
# comment.

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required licensing and community files are present
        run: |
          set -euo pipefail
          missing=0
          for f in \
            LICENSE NOTICE THIRD-PARTY-NOTICES.md README.md CHANGELOG.md \
            CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md \
            Dictionaries/cc-cedict/LICENSE Dictionaries/cc-cedict/README.md
          do
            if [ ! -f "$f" ]; then echo "::error file=$f::required file is missing"; missing=1; fi
          done
          exit $missing

      - name: The MIT/CC BY-SA scope boundary is still declared
        # NOTICE must keep stating that Dictionaries/ is excluded from the MIT
        # license, or the CC BY-SA boundary silently disappears. This lives in
        # NOTICE rather than LICENSE because GitHub's license detection
        # (licensee) only recognises MIT when LICENSE holds nothing but the
        # license text -- a preamble there makes the repo report "Other".
        run: |
          set -euo pipefail
          grep -q "EXCEPT the contents of the Dictionaries/" NOTICE \
            || { echo "::error file=NOTICE::the scope statement excluding Dictionaries/ is gone"; exit 1; }
          grep -q "CC BY-SA 4.0" NOTICE \
            || { echo "::error file=NOTICE::the ShareAlike note on generated databases is gone"; exit 1; }

      - name: LICENSE contains only the license text, so MIT stays detectable
        run: |
          set -euo pipefail
          head -1 LICENSE | grep -qx "MIT License" \
            || { echo "::error file=LICENSE::must begin with 'MIT License' -- any preamble breaks license detection"; exit 1; }
          if grep -qiE "dictionaries/|CC BY-SA|third-party" LICENSE; then
            echo "::error file=LICENSE::explanatory text found. Put scope notes in NOTICE; licensee reports 'Other' otherwise."
            exit 1
          fi

      - name: Dictionary licence statements all agree
        # Checks the data's own header against SOURCE.json, the quoted
        # attribution and the committed legalcode. Pinning a version here
        # instead would mean a correctly refreshed snapshot fails for being
        # right -- which is exactly what happened when the pin moved to a 3.0
        # source and this check still demanded the 4.0 URI.
        run: ./Scripts/check-dictionary-licence.sh

      - name: No redistributable-restricted dictionary data was committed
        # The licensing guard that matters most in practice. BKRS is not ours to
        # redistribute, and a generated database inherits CC BY-SA rather than MIT.
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -E '\.(dsl|dsl\.dz|hanreaderdict)$|(^|/)dabkrs' \
            | grep -v '/Fixtures/' || true)
          if [ -n "$bad" ]; then
            echo "::error::dictionary data must not be committed outside a Tests/**/Fixtures/ directory:"
            echo "$bad"
            exit 1
          fi

      - name: Committed test fixtures stay small
        run: |
          set -euo pipefail
          big=$(find Tests -type d -name Fixtures -exec find {} -type f -size +256k \; 2>/dev/null)
          if [ -n "$big" ]; then
            echo "::error::fixtures over 256 KB -- commit a smaller slice plus its extraction script:"
            echo "$big"
            exit 1
          fi

      - name: App version matches HanReaderCore.version
        # HanReaderCore.version is the single source of truth and is recorded in
        # generated dictionary containers. If the app ships a different
        # MARKETING_VERSION, a database cannot be traced back to its build.
        run: |
          set -euo pipefail
          core=$(grep -oE 'static let version = "[^"]+"' Sources/HanReaderCore/HanReaderCore.swift \
                 | sed -E 's/.*"([^"]+)".*/\1/')
          xc=$(grep -oE '^HANREADER_VERSION = .*' Apps/Shared/Config/Base.xcconfig \
               | sed -E 's/^HANREADER_VERSION = *//')
          echo "HanReaderCore.version=$core  HANREADER_VERSION=$xc"
          # Core may carry a pre-release suffix the bundle cannot express, so
          # compare only the numeric prefix.
          if [ "${core%%-*}" != "$xc" ]; then
            echo "::error file=Apps/Shared/Config/Base.xcconfig::HANREADER_VERSION ($xc) does not match HanReaderCore.version ($core)"
            exit 1
          fi

      - name: The generated Xcode project is not committed
        run: |
          set -euo pipefail
          if git ls-files | grep -q '\.xcodeproj/'; then
            echo "::error::HanReader.xcodeproj is generated by XcodeGen and must stay untracked"
            exit 1
          fi

      - name: Relative links in Markdown resolve
        run: |
          set -euo pipefail
          dead=0
          while IFS= read -r f; do
            d=$(dirname "$f")
            while IFS= read -r link; do
              [ -n "$link" ] || continue
              if [ ! -e "$d/$link" ]; then
                echo "::error file=$f::dead relative link: $link"
                dead=1
              fi
            done < <(
              grep -oE '\]\([^)]+\)' "$f" \
                | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
                | grep -vE '^(https?:|mailto:|$)' \
                | sort -u
            )
          done < <(git ls-files '*.md')
          exit $dead

      - name: Issue templates and workflows are valid YAML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, pathlib, yaml
          bad = False
          for p in list(pathlib.Path(".github").rglob("*.yml")) + list(pathlib.Path(".github").rglob("*.yaml")):
              try:
                  yaml.safe_load(p.read_text())
              except Exception as e:
                  print(f"::error file={p}::invalid YAML: {e}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

  lint:
    # Runs in parallel with the build jobs rather than gating them. Making the
    # others `needs: lint` would save little -- this job is under a minute --
    # and would cost a whole round trip: you would fix a formatting nit, push,
    # and only then discover a failing test. Complete feedback per push is
    # worth more here than the saved runner minutes.
    #
    # Uses the pinned tooling from Scripts/tools.lock rather than whatever the
    # runner image preinstalls, so a contributor's local `make lint` and CI
    # cannot disagree.
    name: Format and lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: .tools
          # bootstrap.sh is in the key as well as tools.lock: it decides how
          # tools are laid out in .tools, so a change to it invalidates the
          # cache contents even when no version moved. Omitting it meant a
          # stale cache restored an old XcodeGen symlink and silently
          # reintroduced a bug that had already been fixed.
          key: tools-${{ runner.os }}-${{ hashFiles('Scripts/tools.lock', 'Scripts/bootstrap.sh') }}

      - name: Install pinned tooling
        run: ./Scripts/bootstrap.sh

      - name: Check formatting
        run: .tools/bin/swiftformat --lint .

      - name: Lint
        run: .tools/bin/swiftlint lint --strict --reporter github-actions-logging

  spm-test:
    # The fast lane: no simulator, no Xcode project, no XcodeGen. Most of the
    # test suite will live here, and this is the job that should fail first when
    # logic breaks.
    name: Swift package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select the pinned toolchain
        # .xcode-version is the single source of truth: DEVELOPER_DIR is derived
        # from it rather than hard-coded, so the two cannot drift apart. If the
        # pinned Xcode is absent -- GitHub replaces patch releases in place --
        # fail here with a readable message and the list of what is installed,
        # rather than letting the build proceed on an unpinned compiler or die
        # on a raw `xcodebuild` error several steps later.
        run: |
          set -euo pipefail
          pinned=$(tr -d '[:space:]' < .xcode-version)
          [ -n "$pinned" ] || { echo "::error file=.xcode-version::file is empty"; exit 1; }

          dir=""
          for candidate in "/Applications/Xcode_${pinned}.app" "/Applications/Xcode_${pinned}".*.app; do
            if [ -d "$candidate/Contents/Developer" ]; then dir="$candidate/Contents/Developer"; break; fi
          done

          if [ -z "$dir" ]; then
            echo "::error file=.xcode-version::Xcode $pinned is not installed on this runner."
            echo "Available Xcode versions:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
            exit 1
          fi

          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
          echo "Selected $dir"

      - name: Report toolchain and record its identity for the cache key
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          # The compiler identity, not just the Xcode marketing version, so a
          # toolchain change always invalidates the build cache.
          swift --version 2>&1 | head -2 > .toolchain-id
          cat .toolchain-id

      - uses: actions/cache@v4
        with:
          path: .build
          # Keyed on the compiler identity as well as the dependency graph.
          # Without the toolchain in the key, an in-place Xcode patch update
          # restores modules built by the previous compiler, which can fail to
          # link in confusing ways.
          key: spm-${{ runner.os }}-${{ hashFiles('.toolchain-id') }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('.toolchain-id') }}-

      - name: Build, treating warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --skip-build

  architecture:
    # The module boundaries, checked three ways. No one of these is sufficient:
    # a Linux build proves portability but would happily accept `import
    # Dispatch`; an import allowlist proves the stated rule but not that the
    # code actually compiles off-Apple; and neither notices a dependency added
    # in Package.swift that no source file has started using yet.
    name: Architecture boundaries
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        # Container jobs default to `sh -e`, which has neither `set -o pipefail`
        # nor process substitution. The Swift images are Ubuntu-based, so bash
        # is present; ask for it explicitly rather than writing POSIX-only
        # scripts in a repo where every other job gets bash by default.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Install python3 for the manifest check
        # The official Swift images are slim and ship no Python. The manifest
        # check parses `swift package dump-package`, which is far more legible
        # in Python than in shell, so spend ~15s on the package rather than
        # hand-rolling JSON parsing in bash.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3
          python3 --version

      - name: HanReaderCore imports only Foundation
        run: |
          set -euo pipefail
          # Allowlist, not a denylist. "No AppKit" would be far too weak a rule:
          # NaturalLanguage and AVFoundation are every bit as Apple-only, and so
          # is Dispatch-plus-Darwin. Anything not named here is a boundary
          # violation and must be justified by editing this list.
          allowed='^(Foundation|FoundationEssentials)$'
          violations=0
          while IFS= read -r file; do
            while IFS= read -r module; do
              [ -n "$module" ] || continue
              if ! printf '%s' "$module" | grep -qE "$allowed"; then
                echo "::error file=$file::HanReaderCore may not import '$module' (allowed: Foundation, FoundationEssentials)"
                violations=1
              fi
            done < <(
              grep -hoE '^[[:space:]]*(public |package |internal )?import [A-Za-z_][A-Za-z0-9_]*' "$file" \
                | awk '{print $NF}'
            )
          done < <(find Sources/HanReaderCore -name '*.swift')
          [ "$violations" -eq 0 ] && echo "Core imports are clean."
          exit $violations

      - name: Package manifest declares the intended graph
        # Reads the manifest itself rather than trusting constants maintained by
        # hand in the sources, which could only ever restate themselves.
        run: |
          set -euo pipefail
          swift package dump-package > /tmp/pkg.json
          python3 - <<'PY'
          import json, sys

          pkg = json.load(open("/tmp/pkg.json"))
          targets = {t["name"]: t for t in pkg["targets"]}
          failures = []

          def deps(name):
              """Names this target depends on, whether sibling targets or products."""
              out = set()
              for d in targets[name].get("dependencies", []):
                  if "byName" in d and d["byName"] and d["byName"][0]:
                      out.add(d["byName"][0])
                  if "target" in d and d["target"] and d["target"][0]:
                      out.add(d["target"][0])
                  if "product" in d and d["product"] and d["product"][0]:
                      out.add(d["product"][0])
              return out

          def check(cond, msg):
              if not cond:
                  failures.append(msg)

          expected = {
              "HanReaderCore": set(),
              "HanReaderTokenization": {"HanReaderCore"},
              "HanReaderPersistence": {"HanReaderCore", "GRDB"},
              "HanReaderDictionaryImport": {"HanReaderCore", "HanReaderPersistence"},
              "HanReaderPlayback": {"HanReaderCore"},
              "HanReaderPlatform": {"HanReaderCore"},
              "HanReaderUI": {
                  "HanReaderCore", "HanReaderTokenization", "HanReaderPersistence",
                  "HanReaderDictionaryImport", "HanReaderPlayback", "HanReaderPlatform",
              },
              "hanreader-dictgen": {
                  "HanReaderCore", "HanReaderPersistence",
                  "HanReaderDictionaryImport", "ArgumentParser",
              },
          }

          for name, want in expected.items():
              check(name in targets, f"target '{name}' is missing from the manifest")
              if name in targets:
                  got = deps(name)
                  check(got == want, f"{name} depends on {sorted(got)}, expected {sorted(want)}")

          # The rules that matter most, stated independently of the table above
          # so that a careless edit to it still trips them.
          check(deps("HanReaderCore") == set(), "HanReaderCore must be a leaf")
          grdb = {n for n in targets if "GRDB" in deps(n)}
          check(grdb == {"HanReaderPersistence"},
                f"only HanReaderPersistence may depend on GRDB, found {sorted(grdb)}")
          ap = {n for n in targets if "ArgumentParser" in deps(n)}
          check(ap == {"hanreader-dictgen"},
                f"only hanreader-dictgen may depend on ArgumentParser, found {sorted(ap)}")

          for f in failures:
              print(f"::error file=Package.swift::{f}")
          if failures:
              sys.exit(1)
          print(f"Manifest graph matches: {len(expected)} targets checked.")
          PY

      - name: Build HanReaderCore in isolation
        run: swift build --target HanReaderCore -Xswiftc -warnings-as-errors

  app-build:
    # Builds both application bundles from the generated project. No signing
    # material anywhere: macOS builds ad-hoc and the iOS Simulator needs none,
    # which is what lets this run on pull requests from forks.
    name: App build (${{ matrix.name }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            scheme: HanReader-macOS
            destination: platform=macOS,arch=arm64
          - name: iOS
            scheme: HanReader-iOS
            # A generic destination builds against the simulator SDK without
            # requiring an installed runtime, which keeps this job independent
            # of which runtimes the image happens to ship.
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v7

      - name: Select the pinned toolchain
        run: |
          set -euo pipefail
          pinned=$(tr -d '[:space:]' < .xcode-version)
          dir=""
          for candidate in "/Applications/Xcode_${pinned}.app" "/Applications/Xcode_${pinned}".*.app; do
            if [ -d "$candidate/Contents/Developer" ]; then dir="$candidate/Contents/Developer"; break; fi
          done
          if [ -z "$dir" ]; then
            echo "::error file=.xcode-version::Xcode $pinned is not installed on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
            exit 1
          fi
          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: .tools
          # bootstrap.sh is in the key as well as tools.lock: it decides how
          # tools are laid out in .tools, so a change to it invalidates the
          # cache contents even when no version moved. Omitting it meant a
          # stale cache restored an old XcodeGen symlink and silently
          # reintroduced a bug that had already been fixed.
          key: tools-${{ runner.os }}-${{ hashFiles('Scripts/tools.lock', 'Scripts/bootstrap.sh') }}

      - name: Generate the Xcode project
        run: make generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project HanReader.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Confirm the bundle was produced with the expected identity
        run: |
          set -euo pipefail
          app=$(find .build/xcode/Build/Products -maxdepth 2 -name 'HanReader.app' -print -quit)
          [ -n "$app" ] || { echo "::error::no HanReader.app was produced"; exit 1; }
          plist="$app/Contents/Info.plist"; [ -f "$plist" ] || plist="$app/Info.plist"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          expected=$(grep -oE '^HANREADER_VERSION = .*' Apps/Shared/Config/Base.xcconfig \
                     | sed -E 's/^HANREADER_VERSION = *//')
          echo "$app -> $id $version (expected version $expected)"
          [ "$id" = "org.openipc.hanreader" ] || { echo "::error::unexpected bundle id $id"; exit 1; }
          # Assert the version too. The hygiene job checks source against
          # xcconfig; this checks that what was actually built matches, which
          # catches the target's own setting diverging from the config.
          [ "$version" = "$expected" ] \
            || { echo "::error::bundle version $version does not match HANREADER_VERSION $expected"; exit 1; }

  dictionary:
    # Compiles and checks the bundled dictionary. The failure this exists to
    # catch is the quiet one: a parser or lexicon change that still produces a
    # valid, openable database containing half the words. Everything builds,
    # the app runs, and words simply stop being found -- nobody notices by eye.
    name: Bundled dictionary
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select the pinned toolchain
        run: |
          set -euo pipefail
          pinned=$(tr -d '[:space:]' < .xcode-version)
          dir=""
          for candidate in "/Applications/Xcode_${pinned}.app" "/Applications/Xcode_${pinned}".*.app; do
            if [ -d "$candidate/Contents/Developer" ]; then dir="$candidate/Contents/Developer"; break; fi
          done
          if [ -z "$dir" ]; then
            echo "::error file=.xcode-version::Xcode $pinned is not installed on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
            exit 1
          fi
          echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"

      - name: The pinned snapshot matches its recorded checksum
        # Guards against the committed data being altered without SOURCE.json
        # being updated to match -- which for CC BY-SA material would mean
        # shipping data whose provenance we can no longer vouch for.
        run: |
          set -euo pipefail
          source_file=Dictionaries/cc-cedict/cedict_ts.u8
          record=Dictionaries/cc-cedict/SOURCE.json
          # Absence is a failure, not a skip. The snapshot is committed, so a
          # missing one means it was removed -- and a job that reports success
          # for an absent dictionary is worse than no job.
          [ -f "$source_file" ] || {
            echo "::error file=$source_file::the pinned snapshot is missing"; exit 1; }
          [ -f "$record" ] || { echo "::error file=$record::missing"; exit 1; }

          recorded=$(python3 -c "import json;print(json.load(open('$record'))['sha256'])")
          actual=$(shasum -a 256 "$source_file" | cut -d' ' -f1)
          if [ "$recorded" != "$actual" ]; then
            echo "::error file=$source_file::checksum does not match SOURCE.json"
            echo "  recorded: $recorded"
            echo "  actual:   $actual"
            exit 1
          fi

          echo "snapshot verified: $actual"

      - name: Licence statements all agree
        run: ./Scripts/check-dictionary-licence.sh

      - uses: actions/cache@v4
        with:
          path: .build
          key: dict-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Compile and verify
        run: make dict

  required-checks:
    # The single required status check for branch protection. Adding or renaming
    # a job above never means touching repository settings.
    name: Required checks
    runs-on: ubuntu-latest
    needs: [hygiene, lint, spm-test, architecture, app-build, dictionary]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a required job did not succeed"
            exit 1
          fi
          echo "All required jobs succeeded."
