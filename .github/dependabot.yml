version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"

  # The swift ecosystem is deliberately absent until Package.swift lands in
  # milestone M1. Dependabot aborts with "No files found in /" when there is no
  # manifest to read, so enabling it early just produces a weekly failed run.
  # Re-add then:
  #
  # - package-ecosystem: swift
  #   directory: "/"
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 3
  #   commit-message:
  #     prefix: "build"
