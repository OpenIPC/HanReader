# Pinned developer tooling.
#
# Scripts/bootstrap.sh reads this file, downloads each archive, verifies its
# SHA-256 before extracting anything, and installs into .tools/ (gitignored).
# No Homebrew, no Mint, no source builds, and no trust in whatever version a
# contributor happens to have on their PATH.
#
# Checksums were taken from the GitHub release asset digests AND verified by
# independent download. To bump a tool, change its version and checksum
# together; bootstrap.sh refuses to run a binary whose hash does not match.
#
# Format, whitespace-separated:
#   name  version  layout  url  sha256
#
# layout is how the archive is shaped, which differs per project:
#   flat  - binary sits at the archive root; extract just that binary
#   tree  - archive contains a directory that must be kept intact, because the
#           binary resolves resources relative to itself (XcodeGen needs
#           share/xcodegen/SettingPresets as a sibling of bin/)

